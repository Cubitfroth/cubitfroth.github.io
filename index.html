<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Line Pattern Generator</title>
<style>
  body {
    background: #111;
    color: white;
    text-align: center;
    font-family: Arial, sans-serif;
  }
  canvas {
    background: #fff;
    margin-top: 20px;
    border: 2px solid #444;
  }
  button {
    margin-top: 15px;
    padding: 10px 20px;
    font-size: 16px;
    cursor: pointer;
  }
</style>
</head>
<body>

<h2>Random Line Pattern Generator</h2>
<canvas id="canvas" width="400" height="400"></canvas>
<br>
<button onclick="generatePattern()">Generate Pattern</button>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

function rand(min, max) {
  return Math.random() * (max - min) + min;
}

function generatePattern() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  let numLines = Math.floor(rand(2, 6)); // 2–5 lines

  for (let i = 0; i < numLines; i++) {
    ctx.beginPath();

    let x1 = rand(50, 350);
    let y1 = rand(50, 350);
    let x2 = rand(50, 350);
    let y2 = rand(50, 350);

    // Randomly decide straight or curved
    if (Math.random() > 0.5) {
      // Straight line
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
    } else {
      // Curved line (quadratic)
      let cx = rand(50, 350);
      let cy = rand(50, 350);
      ctx.moveTo(x1, y1);
      ctx.quadraticCurveTo(cx, cy, x2, y2);
    }

    ctx.strokeStyle = `hsl(${rand(0,360)}, 80%, 40%)`;
    ctx.lineWidth = rand(1, 4);
    ctx.stroke();
  }
}

// Auto-generate first pattern
generatePattern();
</script>

</body>
</html>
